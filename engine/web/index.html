<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rea-video</title>
<style>
  :root { color-scheme: light dark; --line: #8884; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 1080px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .muted { opacity: .65; }
  table { width: 100%; border-collapse: collapse; margin: 16px 0; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.log { white-space: normal; font: 12px/1.4 ui-monospace, monospace; max-width: 420px; overflow: hidden; max-height: 90px; }
  input, button { font: inherit; padding: 6px 8px; }
  form { display: grid; gap: 8px; border: 1px solid var(--line); padding: 12px; border-radius: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  video { width: 100%; max-height: 420px; background: #000; }
  .pill { padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
</style>
</head>
<body>
<h1>rea-video</h1>
<div class="row muted"><span id="health">连接中…</span><button id="refresh">刷新</button></div>

<form id="submit">
  <strong>提交一条成片任务</strong>
  <input name="source" placeholder="源视频绝对路径" required>
  <input name="photos" placeholder="商品图路径，逗号分隔（1–3 张）" required>
  <input name="out" placeholder="输出目录绝对路径" required>
  <div class="row">推理完成后自动做旁白与验收，不需要另点。</div>
  <div class="row"><button type="submit">加入队列</button><span id="message" class="muted"></span></div>
</form>

<table>
  <thead><tr><th>状态</th><th>任务</th><th>输出</th><th>尝试</th><th>日志</th><th>操作</th></tr></thead>
  <tbody id="jobs"></tbody>
</table>

<video id="player" controls hidden></video>

<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = { jobs: [] };

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

async function refresh() {
  try {
    const [h, j] = await Promise.all([api('/api/health'), api('/api/jobs')]);
    $('#health').textContent = 'ComfyUI ' + (h.comfyui ? '在线' : '离线') + ' · 队列 ' + h.queue + ' · 等待 ' + h.waiting;
    state.jobs = j.jobs;
    render(j.jobs);
  } catch (e) {
    $('#health').textContent = '服务不可用：' + e.message;
  }
}

async function logOf(id) {
  try { return (await api('/api/jobs/' + id + '/log')).log.split('\n').slice(-4).join(' '); }
  catch { return ''; }
}

function render(list) {
  $('#jobs').innerHTML = list.map((job) => '<tr>' +
    '<td><span class="pill">' + esc(job.state) + '</span></td>' +
    '<td title="' + esc(job.id) + '">' + esc(job.source.split(/[\\/]/).pop()) + '</td>' +
    '<td title="' + esc(job.out) + '">' + esc(job.out.split(/[\\/]/).pop()) + '</td>' +
    '<td>' + (job.attempts || 0) + '</td>' +
    '<td class="log" id="log-' + job.id + '">…</td>' +
    '<td class="row">' +
      '<button data-act="cancel" data-id="' + job.id + '">取消</button>' +
      (job.state === 'interrupted' ? '<button data-act="resume" data-id="' + job.id + '">核对后继续</button>' : '') +
      (job.state === 'done' ? '<button data-act="play" data-id="' + job.id + '">看成片</button>' : '') +
    '</td></tr>').join('');
  list.forEach(async (job) => {
    const cell = document.getElementById('log-' + job.id);
    if (cell) cell.textContent = await logOf(job.id) || '…';
  });
}

$('#refresh').onclick = refresh;
$('#submit').onsubmit = async (event) => {
  event.preventDefault();
  const form = new FormData(event.target);
  $('#message').textContent = '提交中…';
  try {
    await api('/api/jobs', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({source: form.get('source'), out: form.get('out'),
        photos: String(form.get('photos')).split(',').map((s) => s.trim()).filter(Boolean)})});
    $('#message').textContent = '已加入队列';
    refresh();
  } catch (e) { $('#message').textContent = '失败：' + e.message; }
};

document.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-act]');
  if (!button) return;
  const {act, id} = button.dataset;
  if (act === 'play') {
    const player = $('#player');
    player.hidden = false;
    player.src = '/api/media?id=' + id;
    player.play().catch(() => {});
    return;
  }
  const path = '/api/jobs/' + id + '/' + act;
  const body = act === 'resume' ? {confirm: false} : {};
  try {
    const result = await api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (act === 'resume') {
      const verdict = result.reconciliation || {};
      if (!confirm('ComfyUI 核对结果：' + verdict.verdict + '\n' + (verdict.detail || '') + '\n\n确认继续这条任务？')) return;
      await api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({confirm: true})});
    }
  } catch (e) { alert(e.message); }
  refresh();
});

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
